name: AWS EC2 CD

on:
  push:
    branches: ["staging", "main", "infra/docker-aws-setup", "feat/monitoring", "revision"]
  workflow_dispatch:

concurrency:
  group: voucher-ec2-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_ec2:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      IMAGE_NAME: json-voucher-service
      CONTAINER_NAME: json-voucher-service
      APP_PORT: 8080
      MONITORING_STACK_DIR: /opt/json-voucher-monitoring
      DOCKER_NETWORK: voucher-observability
      SSH_PORT: ${{ secrets.AWS_EC2_PORT || '22' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" -t "$IMAGE_NAME:latest" .

      - name: Export Docker image
        run: docker save "$IMAGE_NAME:latest" | gzip > "$IMAGE_NAME.tar.gz"

      - name: Package monitoring stack
        run: tar -czf monitoring-stack.tar.gz monitoring

      - name: Validate deploy secrets
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          EC2_USER: ${{ secrets.AWS_EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_USERNAME: ${{ secrets.SUPABASE_DB_USERNAME }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "Missing AWS EC2 SSH secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_DB_USERNAME" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing Supabase database secrets."
            exit 1
          fi

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -p "$SSH_PORT" "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload deploy artifacts to EC2
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          EC2_USER: ${{ secrets.AWS_EC2_USER }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "rm -f /tmp/$IMAGE_NAME.tar.gz /tmp/monitoring-stack.tar.gz"
          scp -P "$SSH_PORT" -i ~/.ssh/ec2_key "$IMAGE_NAME.tar.gz" "$EC2_USER@$EC2_HOST:/tmp/$IMAGE_NAME.tar.gz"
          scp -P "$SSH_PORT" -i ~/.ssh/ec2_key monitoring-stack.tar.gz "$EC2_USER@$EC2_HOST:/tmp/monitoring-stack.tar.gz"

      - name: Deploy app and monitoring on EC2
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          EC2_USER: ${{ secrets.AWS_EC2_USER }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_USERNAME: ${{ secrets.SUPABASE_DB_USERNAME }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS || 'http://localhost:3000' }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "
            set -e
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-plugin
              sudo systemctl enable --now docker
            fi

            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            sudo docker network create $DOCKER_NETWORK >/dev/null 2>&1 || true
            sudo mkdir -p $MONITORING_STACK_DIR
            sudo tar -xzf /tmp/monitoring-stack.tar.gz -C $MONITORING_STACK_DIR --strip-components=1
            sudo chown -R $EC2_USER:$EC2_USER $MONITORING_STACK_DIR

            sudo docker rm -f $CONTAINER_NAME || true
            sudo docker images '$IMAGE_NAME' --format '{{.Repository}}:{{.Tag}}' | xargs -r sudo docker rmi -f || true
            sudo docker builder prune -af || true
            sudo docker image prune -af || true
            sudo docker container prune -f || true

            sudo docker load -i /tmp/$IMAGE_NAME.tar.gz
            sudo docker rm -f $CONTAINER_NAME || true
            sudo docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              --network $DOCKER_NETWORK \
              -p $APP_PORT:8080 \
              -e PORT=8080 \
              -e SUPABASE_DB_URL='$SUPABASE_DB_URL' \
              -e SUPABASE_DB_USERNAME='$SUPABASE_DB_USERNAME' \
              -e SUPABASE_DB_PASSWORD='$SUPABASE_DB_PASSWORD' \
              -e APP_CORS_ALLOWED_ORIGINS='$APP_CORS_ALLOWED_ORIGINS' \
              $IMAGE_NAME:latest

            cd $MONITORING_STACK_DIR
            sudo docker compose up -d --remove-orphans
            rm -f /tmp/$IMAGE_NAME.tar.gz /tmp/monitoring-stack.tar.gz
          "

      - name: Smoke test EC2 app health endpoint
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          EC2_USER: ${{ secrets.AWS_EC2_USER }}
        run: |
          for i in {1..12}; do
            if ssh -p "$SSH_PORT" -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
              "curl --fail --silent --show-error 127.0.0.1:$APP_PORT/actuator/health" | grep '"status":"UP"'; then
              exit 0
            fi
            echo "App health check attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
          echo "Service did not become healthy in time."
          exit 1

      - name: Smoke test EC2 monitoring stack
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          EC2_USER: ${{ secrets.AWS_EC2_USER }}
        run: |
          for i in {1..12}; do
            if ssh -p "$SSH_PORT" -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
              "curl --fail --silent 127.0.0.1:9090/-/ready >/dev/null && curl --fail --silent 127.0.0.1:3001/api/health | grep 'ok' >/dev/null"; then
              exit 0
            fi
            echo "Monitoring health check attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
          echo "Monitoring stack did not become healthy in time."
          exit 1
